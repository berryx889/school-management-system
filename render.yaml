# Render Blueprint for the SMS API. Import this repo as a Blueprint in Render, or create a
# Web Service manually with the same settings. The frontend deploys separately on Vercel.
services:
  - type: web
    name: sms-server
    runtime: node
    rootDir: server
    plan: free
    # Migrations are idempotent, so running them on every deploy keeps the schema current.
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Neon connection string (Pooled). Set in the Render dashboard — never commit it.
      - key: DATABASE_URL
        sync: false
      # Signing secret for JWTs — Render generates a strong value.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Your Vercel URL, e.g. https://our-world-model-school.vercel.app (for CORS).
      - key: CLIENT_URL
        sync: false
      # Optional integrations — leave unset until you have keys.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        sync: false
